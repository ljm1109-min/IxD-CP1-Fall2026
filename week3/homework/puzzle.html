<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="puzzle.css">
    <title>Flower Puzzle</title>
</head>
<body>
    <main id="puzzle">
        <h1>Help the flower bloom!</h1>
        <p>Click the buttons in the order a flower grows.</p>

        <section id="buttons">
            <button id="btnBloom">🌸</button>
            <button id="btnSprout">🌱</button>
            <button id="btnTulip">🌷</button>
            <button id="btnLeaf">🌿</button>
        </section>

        <p id="message">Start with the smallest one.</p>

        <img src="images/flower.webp" alt="A blooming flower" id="prize">
    </main>

    <script src="puzzle.js"></script>
</body>
</html>
