<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Image Gallery</title>
</head>
<body>
    <header>
        <p id="logo">MIN LEE</p>
        <nav>
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main id="gallery">
        <section id="thumbnails">
            <img src="images/flower1.webp" alt="flower 1" id="thumb1" class="thumb">
            <img src="images/flower2.webp" alt="flower 2" id="thumb2" class="thumb">
            <img src="images/flower3.webp" alt="flower 3" id="thumb3" class="thumb">
            <img src="images/flower4.webp" alt="flower 4" id="thumb4" class="thumb">
        </section>

        <section id="display">
            <img src="images/flower1.webp" alt="flower 1" id="bigImage">
        </section>
        
        <section id="controls">
            <button id="playBtn">Play</button>
            <button id="pauseBtn">Pause</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
